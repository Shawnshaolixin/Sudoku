buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // AGP 升级到 8.4.2：内置 D8 支持 Kotlin 2.0 元数据（Firebase 13.15 依赖需要）
        // 原为 7.4.2，会触发 "D8: com.android.tools.r8.kotlin.H" StackOverflowError
        classpath 'com.android.tools.build:gradle:8.4.2'
**SPM_INITIALIZE**    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
**ARTIFACTORY_REPOSITORY**    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'preReleaseBuild' || task.name == 'preDebugBuild') {
        task.dependsOn 'SPM_REMOVE_SCRIPT'
    }
}
